apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-price-app
  namespace: car-price
  labels:
    app: car-price-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: car-price-app
  template:
    metadata:
      labels:
        app: car-price-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: app
          image: ghcr.io/siddh-sh/mlops:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
            - name: metrics
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
